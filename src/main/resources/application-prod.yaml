# Production reads everything that varies from the environment. There is no
# default for a secret: a missing variable stops the boot instead of guessing.
spring:
  datasource:
    url: ${CSS_DB_URL}
    username: ${CSS_DB_USER}
    password: ${CSS_DB_PASSWORD}

app:
  downstream:
    base-url: ${CSS_DOWNSTREAM_URL}
    timeout: ${CSS_DOWNSTREAM_TIMEOUT:2s}
