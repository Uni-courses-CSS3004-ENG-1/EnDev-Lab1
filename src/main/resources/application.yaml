# Shared by every profile. No URL and no password live here: they belong to
# application-dev.yaml (the laptop) and application-prod.yaml (env vars).
spring:
  profiles:
    # a boot with no flag uses the laptop database; production sets SPRING_PROFILES_ACTIVE=prod
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

springdoc:
  override-with-generic-response: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
