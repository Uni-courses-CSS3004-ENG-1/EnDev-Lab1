spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/css
    username: css
    password: css
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
