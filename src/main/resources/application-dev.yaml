# The laptop: PostgreSQL from compose.yaml and a payment provider stub on port 9090.
# css/css is the classroom default from Lab 3, not a real secret.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/css
    username: css
    password: css

app:
  jwt:
    # HS256 signs and checks with this one key. Classroom value, laptop only; 32+ characters.
    secret: dev-only-tutoring-jwt-secret-change-me-0123456789
  downstream:
    base-url: http://localhost:9090
    timeout: 2s
